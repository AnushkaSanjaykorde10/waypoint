<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Button</title>
<style>
  :root {
    --bg: #0b0d14;
    --accent: #6c5ce7;
    --accent-2: #00d4ff;
    --text: #f2f4ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(800px 500px at 50% 40%, #171a2b 0%, var(--bg) 70%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  /* ---------- button ---------- */
  .glow-btn {
    position: relative;
    isolation: isolate;
    padding: 18px 46px;
    border: 0;
    border-radius: 999px;
    font: 600 17px/1 inherit;
    letter-spacing: .04em;
    color: var(--text);
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:
      0 6px 20px -6px rgba(108, 92, 231, .7),
      inset 0 1px 0 rgba(255, 255, 255, .25);
    transition:
      transform .22s cubic-bezier(.2, .8, .3, 1),
      box-shadow .22s ease,
      filter .22s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .glow-btn__label {
    position: relative;
    z-index: 2;
  }

  /* soft breathing halo behind the button */
  .glow-btn::before {
    content: "";
    position: absolute;
    inset: -6px;
    z-index: -1;
    border-radius: inherit;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    filter: blur(18px);
    opacity: .55;
    animation: breathe 3.2s ease-in-out infinite;
    transition: opacity .22s ease, filter .22s ease;
  }

  /* sheen that sweeps across on hover */
  .glow-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    overflow: hidden;
    background: linear-gradient(
      100deg,
      transparent 35%,
      rgba(255, 255, 255, .38) 50%,
      transparent 65%
    );
    background-size: 250% 100%;
    background-position: 160% 0;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
  }

  .glow-btn:hover {
    transform: translateY(-3px);
    filter: saturate(1.15);
    box-shadow:
      0 14px 34px -8px rgba(108, 92, 231, .95),
      0 0 0 1px rgba(255, 255, 255, .08),
      inset 0 1px 0 rgba(255, 255, 255, .35);
  }

  .glow-btn:hover::before {
    opacity: .95;
    filter: blur(24px);
  }

  .glow-btn:hover::after {
    opacity: 1;
    animation: sheen .9s ease-out;
  }

  .glow-btn:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 5px;
  }

  .glow-btn:active {
    transform: translateY(1px) scale(.96);
    box-shadow:
      0 4px 14px -6px rgba(108, 92, 231, .8),
      inset 0 2px 6px rgba(0, 0, 0, .35);
    transition-duration: .08s;
  }

  /* ---------- click effects ---------- */

  /* clips ripples to the pill outline (the button itself can't use
     overflow:hidden — it would cut off the ::before halo) */
  .ripple-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    overflow: hidden;
    pointer-events: none;
  }

  /* ripple that grows from the exact click point */
  .ripple {
    position: absolute;
    z-index: 1;
    border-radius: 50%;
    background: rgba(255, 255, 255, .45);
    transform: translate(-50%, -50%) scale(0);
    animation: ripple .55s cubic-bezier(.2, .7, .3, 1) forwards;
    pointer-events: none;
  }

  /* expanding ring that escapes the button outline */
  .glow-btn.is-clicked .ring {
    animation: ring .6s cubic-bezier(.2, .7, .3, 1) forwards;
  }

  .ring {
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    border: 2px solid var(--accent-2);
    opacity: 0;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { opacity: .45; transform: scale(.98); }
    50%      { opacity: .75; transform: scale(1.04); }
  }

  @keyframes sheen {
    from { background-position: 160% 0; }
    to   { background-position: -60% 0; }
  }

  @keyframes ripple {
    to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  @keyframes ring {
    from { opacity: .9; transform: scale(1); }
    to   { opacity: 0;  transform: scale(1.45); }
  }

  .count {
    margin-top: 26px;
    text-align: center;
    color: #7d84a8;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-btn, .glow-btn::before, .glow-btn::after,
    .ripple, .ring {
      animation: none !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div>
  <button class="glow-btn" type="button" id="btn">
    <span class="ring"></span>
    <span class="ripple-layer" id="rippleLayer"></span>
    <span class="glow-btn__label">Launch</span>
  </button>
  <p class="count" id="count">Clicked 0 times</p>
</div>

<script>
  const btn = document.getElementById('btn');
  const layer = document.getElementById('rippleLayer');
  const countEl = document.getElementById('count');
  let clicks = 0;

  function spawnRipple(x, y) {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2.2;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.addEventListener('animationend', () => ripple.remove());
    layer.appendChild(ripple);
  }

  // ripple originates where the pointer actually landed
  btn.addEventListener('pointerdown', (e) => {
    const rect = btn.getBoundingClientRect();
    spawnRipple(e.clientX - rect.left, e.clientY - rect.top);
  });

  btn.addEventListener('click', (e) => {
    // keyboard activation has no pointer position — ripple from the centre
    if (e.detail === 0) {
      spawnRipple(btn.offsetWidth / 2, btn.offsetHeight / 2);
    }

    btn.classList.remove('is-clicked');
    void btn.offsetWidth;          // restart the ring animation
    btn.classList.add('is-clicked');

    clicks++;
    countEl.textContent = 'Clicked ' + clicks + (clicks === 1 ? ' time' : ' times');
  });
</script>

</body>
</html>
